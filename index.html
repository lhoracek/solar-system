<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Solar System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            overflow: hidden;
            background: #000;
            font-family: 'Segoe UI', sans-serif;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px 20px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        #info h1 {
            font-size: 1.2rem;
            margin-bottom: 8px;
            color: #ffd700;
        }
        #info p {
            font-size: 0.8rem;
            color: #aaa;
            line-height: 1.5;
        }
        #follow-status {
            color: #ffd700 !important;
        }
        #planet-label {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #fff;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 0.9rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: none;
        }
        #time-control {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: #fff;
            background: rgba(0, 0, 0, 0.7);
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.8rem;
        }
        #time-control input {
            width: 150px;
            cursor: pointer;
        }
        #time-value {
            min-width: 3em;
            text-align: right;
            color: #ffd700;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="info">
        <h1>☀️ Solar System</h1>
        <p>Drag to rotate | Scroll to zoom | Right-click to pan</p>
        <p>Click a planet or moon to follow it | Click empty space to release</p>
        <p id="follow-status"></p>
    </div>
    <div id="planet-label"></div>
    <div id="time-control">
        <span>Time</span>
        <input type="range" id="time-scale" min="0" max="1" step="0.001" value="0.316">
        <span id="time-value">0.10x</span>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script>
        // Procedural texture generation
        function createTexture(width, height, drawFn) {
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            drawFn(ctx, width, height);
            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;
            return texture;
        }

        function createSunTexture() {
            return createTexture(512, 256, (ctx, w, h) => {
                const gradient = ctx.createLinearGradient(0, 0, 0, h);
                gradient.addColorStop(0, '#ff8800');
                gradient.addColorStop(0.3, '#ffcc00');
                gradient.addColorStop(0.5, '#ffee44');
                gradient.addColorStop(0.7, '#ffcc00');
                gradient.addColorStop(1, '#ff8800');
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, w, h);

                // Add granulation spots
                for (let i = 0; i < 2000; i++) {
                    const x = Math.random() * w;
                    const y = Math.random() * h;
                    const r = Math.random() * 3 + 1;
                    const brightness = Math.random() * 60 - 30;
                    ctx.fillStyle = `rgba(${255 + brightness}, ${200 + brightness}, ${50 + brightness}, 0.3)`;
                    ctx.beginPath();
                    ctx.arc(x, y, r, 0, Math.PI * 2);
                    ctx.fill();
                }

                // Add some darker sunspots
                for (let i = 0; i < 15; i++) {
                    const x = Math.random() * w;
                    const y = h * 0.2 + Math.random() * h * 0.6;
                    const r = Math.random() * 8 + 3;
                    ctx.fillStyle = 'rgba(180, 80, 0, 0.4)';
                    ctx.beginPath();
                    ctx.arc(x, y, r, 0, Math.PI * 2);
                    ctx.fill();
                }
            });
        }

        function createMercuryTexture() {
            return createTexture(512, 256, (ctx, w, h) => {
                ctx.fillStyle = '#8c8c8c';
                ctx.fillRect(0, 0, w, h);

                // Craters
                for (let i = 0; i < 300; i++) {
                    const x = Math.random() * w;
                    const y = Math.random() * h;
                    const r = Math.random() * 6 + 1;
                    const shade = Math.floor(Math.random() * 40 + 100);
                    ctx.fillStyle = `rgba(${shade}, ${shade}, ${shade}, 0.5)`;
                    ctx.beginPath();
                    ctx.arc(x, y, r, 0, Math.PI * 2);
                    ctx.fill();
                    // Crater rim highlight
                    ctx.strokeStyle = `rgba(${shade + 30}, ${shade + 30}, ${shade + 30}, 0.3)`;
                    ctx.lineWidth = 1;
                    ctx.stroke();
                }
            });
        }

        function createVenusTexture() {
            return createTexture(512, 256, (ctx, w, h) => {
                const gradient = ctx.createLinearGradient(0, 0, 0, h);
                gradient.addColorStop(0, '#c8a050');
                gradient.addColorStop(0.3, '#e8c878');
                gradient.addColorStop(0.5, '#f0d890');
                gradient.addColorStop(0.7, '#e8c878');
                gradient.addColorStop(1, '#c8a050');
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, w, h);

                // Cloud bands
                for (let i = 0; i < 20; i++) {
                    const y = Math.random() * h;
                    const bandHeight = Math.random() * 15 + 5;
                    const alpha = Math.random() * 0.3 + 0.1;
                    ctx.fillStyle = `rgba(255, 240, 200, ${alpha})`;
                    ctx.fillRect(0, y, w, bandHeight);
                }

                // Swirl patterns
                for (let i = 0; i < 50; i++) {
                    const x = Math.random() * w;
                    const y = Math.random() * h;
                    const r = Math.random() * 20 + 5;
                    ctx.fillStyle = `rgba(220, 190, 120, 0.2)`;
                    ctx.beginPath();
                    ctx.ellipse(x, y, r, r * 0.4, Math.random() * 0.5, 0, Math.PI * 2);
                    ctx.fill();
                }
            });
        }

        function createEarthTexture() {
            return createTexture(512, 256, (ctx, w, h) => {
                // Ocean base
                const gradient = ctx.createLinearGradient(0, 0, 0, h);
                gradient.addColorStop(0, '#1a3a6a');
                gradient.addColorStop(0.3, '#2255aa');
                gradient.addColorStop(0.5, '#2266bb');
                gradient.addColorStop(0.7, '#2255aa');
                gradient.addColorStop(1, '#1a3a6a');
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, w, h);

                // Continents
                function drawContinent(cx, cy, size, color) {
                    ctx.fillStyle = color;
                    ctx.beginPath();
                    for (let i = 0; i < 8; i++) {
                        const angle = (i / 8) * Math.PI * 2;
                        const r = size * (0.6 + Math.random() * 0.4);
                        const x = cx + Math.cos(angle) * r;
                        const y = cy + Math.sin(angle) * r * 0.6;
                        if (i === 0) ctx.moveTo(x, y);
                        else ctx.lineTo(x, y);
                    }
                    ctx.closePath();
                    ctx.fill();
                }

                // North America
                drawContinent(100, 70, 40, '#3a7a3a');
                drawContinent(120, 85, 25, '#4a8a4a');
                // South America
                drawContinent(140, 150, 30, '#3a8a3a');
                // Europe
                drawContinent(250, 60, 20, '#4a8a4a');
                // Africa
                drawContinent(270, 120, 35, '#5a8a3a');
                drawContinent(280, 140, 25, '#6a9a4a');
                // Asia
                drawContinent(350, 70, 50, '#3a7a3a');
                drawContinent(380, 90, 35, '#4a8a4a');
                // Australia
                drawContinent(420, 160, 20, '#8a7a3a');

                // Ice caps
                ctx.fillStyle = 'rgba(220, 230, 240, 0.8)';
                ctx.fillRect(0, 0, w, 15);
                ctx.fillRect(0, h - 15, w, 15);

                // Clouds
                for (let i = 0; i < 80; i++) {
                    const x = Math.random() * w;
                    const y = Math.random() * h;
                    const rw = Math.random() * 30 + 10;
                    const rh = Math.random() * 8 + 3;
                    ctx.fillStyle = `rgba(255, 255, 255, ${Math.random() * 0.3 + 0.1})`;
                    ctx.beginPath();
                    ctx.ellipse(x, y, rw, rh, 0, 0, Math.PI * 2);
                    ctx.fill();
                }
            });
        }

        function createMarsTexture() {
            return createTexture(512, 256, (ctx, w, h) => {
                const gradient = ctx.createLinearGradient(0, 0, 0, h);
                gradient.addColorStop(0, '#8b3a2a');
                gradient.addColorStop(0.3, '#c45530');
                gradient.addColorStop(0.5, '#d4663a');
                gradient.addColorStop(0.7, '#c45530');
                gradient.addColorStop(1, '#8b3a2a');
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, w, h);

                // Dark regions (maria)
                for (let i = 0; i < 20; i++) {
                    const x = Math.random() * w;
                    const y = h * 0.3 + Math.random() * h * 0.4;
                    const r = Math.random() * 30 + 10;
                    ctx.fillStyle = `rgba(100, 40, 20, ${Math.random() * 0.3 + 0.1})`;
                    ctx.beginPath();
                    ctx.ellipse(x, y, r, r * 0.5, Math.random(), 0, Math.PI * 2);
                    ctx.fill();
                }

                // Polar caps
                ctx.fillStyle = 'rgba(230, 220, 210, 0.7)';
                ctx.fillRect(0, 0, w, 12);
                ctx.fillRect(0, h - 12, w, 12);

                // Surface variation
                for (let i = 0; i < 500; i++) {
                    const x = Math.random() * w;
                    const y = Math.random() * h;
                    const r = Math.random() * 3 + 1;
                    const shade = Math.random() > 0.5 ? 20 : -20;
                    ctx.fillStyle = `rgba(${180 + shade}, ${80 + shade}, ${40 + shade}, 0.3)`;
                    ctx.beginPath();
                    ctx.arc(x, y, r, 0, Math.PI * 2);
                    ctx.fill();
                }
            });
        }

        function createJupiterTexture() {
            return createTexture(512, 256, (ctx, w, h) => {
                // Banded structure
                const bands = [
                    '#c8a060', '#e8c880', '#a07040', '#d4a860',
                    '#f0d890', '#b88850', '#e0b870', '#c09050',
                    '#d4a060', '#f0d080', '#a87848', '#e8c070'
                ];
                const bandHeight = h / bands.length;
                bands.forEach((color, i) => {
                    ctx.fillStyle = color;
                    ctx.fillRect(0, i * bandHeight, w, bandHeight + 1);
                });

                // Blend bands with subtle noise
                for (let i = 0; i < 3000; i++) {
                    const x = Math.random() * w;
                    const y = Math.random() * h;
                    const r = Math.random() * 4 + 1;
                    const shade = Math.random() * 30 - 15;
                    ctx.fillStyle = `rgba(${200 + shade}, ${160 + shade}, ${100 + shade}, 0.2)`;
                    ctx.beginPath();
                    ctx.arc(x, y, r, 0, Math.PI * 2);
                    ctx.fill();
                }

                // Great Red Spot
                ctx.fillStyle = 'rgba(180, 60, 30, 0.8)';
                ctx.beginPath();
                ctx.ellipse(350, 150, 30, 18, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = 'rgba(200, 80, 40, 0.6)';
                ctx.beginPath();
                ctx.ellipse(350, 150, 20, 12, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = 'rgba(220, 100, 50, 0.4)';
                ctx.beginPath();
                ctx.ellipse(350, 150, 10, 6, 0, 0, Math.PI * 2);
                ctx.fill();

                // Turbulence at band edges
                for (let i = 0; i < 40; i++) {
                    const y = (i / 40) * h;
                    const x = Math.random() * w;
                    const rw = Math.random() * 40 + 10;
                    ctx.fillStyle = `rgba(255, 240, 200, 0.15)`;
                    ctx.beginPath();
                    ctx.ellipse(x, y, rw, 3, 0, 0, Math.PI * 2);
                    ctx.fill();
                }
            });
        }

        function createSaturnTexture() {
            return createTexture(512, 256, (ctx, w, h) => {
                const bands = [
                    '#c8a860', '#e0c880', '#d4b070', '#f0d898',
                    '#c8a050', '#e8d090', '#d0a860', '#f0d080',
                    '#c0a058', '#e8c878', '#d8b878', '#f0d890'
                ];
                const bandHeight = h / bands.length;
                bands.forEach((color, i) => {
                    ctx.fillStyle = color;
                    ctx.fillRect(0, i * bandHeight, w, bandHeight + 1);
                });

                // Subtle variation
                for (let i = 0; i < 2000; i++) {
                    const x = Math.random() * w;
                    const y = Math.random() * h;
                    const r = Math.random() * 3 + 1;
                    const shade = Math.random() * 20 - 10;
                    ctx.fillStyle = `rgba(${220 + shade}, ${190 + shade}, ${130 + shade}, 0.15)`;
                    ctx.beginPath();
                    ctx.arc(x, y, r, 0, Math.PI * 2);
                    ctx.fill();
                }
            });
        }

        function createUranusTexture() {
            return createTexture(512, 256, (ctx, w, h) => {
                const gradient = ctx.createLinearGradient(0, 0, 0, h);
                gradient.addColorStop(0, '#6ab8c8');
                gradient.addColorStop(0.3, '#88d0e0');
                gradient.addColorStop(0.5, '#98dce8');
                gradient.addColorStop(0.7, '#88d0e0');
                gradient.addColorStop(1, '#6ab8c8');
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, w, h);

                // Very subtle banding
                for (let i = 0; i < 10; i++) {
                    const y = (i / 10) * h;
                    ctx.fillStyle = `rgba(255, 255, 255, 0.05)`;
                    ctx.fillRect(0, y, w, h / 20);
                }

                // Slight atmospheric variation
                for (let i = 0; i < 500; i++) {
                    const x = Math.random() * w;
                    const y = Math.random() * h;
                    const r = Math.random() * 5 + 2;
                    ctx.fillStyle = `rgba(150, 220, 235, 0.1)`;
                    ctx.beginPath();
                    ctx.arc(x, y, r, 0, Math.PI * 2);
                    ctx.fill();
                }
            });
        }

        function createNeptuneTexture() {
            return createTexture(512, 256, (ctx, w, h) => {
                const gradient = ctx.createLinearGradient(0, 0, 0, h);
                gradient.addColorStop(0, '#2244aa');
                gradient.addColorStop(0.3, '#3366cc');
                gradient.addColorStop(0.5, '#4477dd');
                gradient.addColorStop(0.7, '#3366cc');
                gradient.addColorStop(1, '#2244aa');
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, w, h);

                // Dark spot
                ctx.fillStyle = 'rgba(20, 40, 100, 0.6)';
                ctx.beginPath();
                ctx.ellipse(200, 130, 25, 15, 0, 0, Math.PI * 2);
                ctx.fill();

                // Cloud streaks
                for (let i = 0; i < 30; i++) {
                    const x = Math.random() * w;
                    const y = Math.random() * h;
                    const rw = Math.random() * 40 + 10;
                    ctx.fillStyle = `rgba(100, 150, 255, 0.15)`;
                    ctx.beginPath();
                    ctx.ellipse(x, y, rw, 3, 0, 0, Math.PI * 2);
                    ctx.fill();
                }

                // Bright cloud features
                for (let i = 0; i < 15; i++) {
                    const x = Math.random() * w;
                    const y = h * 0.3 + Math.random() * h * 0.4;
                    const rw = Math.random() * 20 + 5;
                    ctx.fillStyle = `rgba(180, 210, 255, 0.2)`;
                    ctx.beginPath();
                    ctx.ellipse(x, y, rw, 4, 0, 0, Math.PI * 2);
                    ctx.fill();
                }
            });
        }

        function createMoonTexture() {
            return createTexture(256, 128, (ctx, w, h) => {
                ctx.fillStyle = '#999999';
                ctx.fillRect(0, 0, w, h);

                for (let i = 0; i < 200; i++) {
                    const x = Math.random() * w;
                    const y = Math.random() * h;
                    const r = Math.random() * 4 + 1;
                    const shade = Math.floor(Math.random() * 50 + 120);
                    ctx.fillStyle = `rgba(${shade}, ${shade}, ${shade}, 0.5)`;
                    ctx.beginPath();
                    ctx.arc(x, y, r, 0, Math.PI * 2);
                    ctx.fill();
                }
            });
        }

        // Scene setup
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 10000);
        camera.position.set(0, 80, 150);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // Controls
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 20;
        controls.maxDistance = 500;

        // Lighting
        const ambientLight = new THREE.AmbientLight(0x333333);
        scene.add(ambientLight);

        const sunLight = new THREE.PointLight(0xffffff, 2, 1000);
        sunLight.position.set(0, 0, 0);
        scene.add(sunLight);

        // Starfield: a general sprinkle of background stars plus a denser,
        // patchy band representing the Milky Way. The galactic plane is
        // really tilted about 60° from the ecliptic (the plane the planets
        // orbit in, our world XZ plane) — that tilt is the accurate part.
        // Which compass direction the band points at t=0 isn't, since this
        // scene has no fixed celestial reference frame (no vernal equinox,
        // no real right-ascension origin) to anchor it to.
        function createStarfield() {
            const geometry = new THREE.BufferGeometry();
            const vertices = [];

            const galacticTilt = 60.2 * Math.PI / 180;
            const galacticNormal = new THREE.Vector3(0, Math.cos(galacticTilt), Math.sin(galacticTilt)).normalize();
            const bandU = new THREE.Vector3(1, 0, 0);
            const bandV = new THREE.Vector3().crossVectors(galacticNormal, bandU).normalize();

            const STAR_COUNT = 14000;
            const BAND_FRACTION = 0.7;
            const BAND_HALF_WIDTH = 0.12; // radians of scatter either side of the galactic plane

            const dir = new THREE.Vector3();

            for (let i = 0; i < STAR_COUNT; i++) {
                if (i < STAR_COUNT * BAND_FRACTION) {
                    // Band stars: cluster near the galactic plane, with patchy
                    // density along it (the real Milky Way isn't a uniform
                    // ring — dust lanes and star clouds vary its brightness).
                    let phi;
                    let accepted = false;
                    while (!accepted) {
                        phi = Math.random() * Math.PI * 2;
                        const patchiness = 0.55 + 0.25 * Math.sin(phi * 3 + 1.3) + 0.2 * Math.sin(phi * 7 - 2.1);
                        accepted = Math.random() < Math.max(0.15, patchiness);
                    }
                    // Averaging three uniforms approximates a bell curve, so
                    // scatter clusters near the plane rather than smearing evenly.
                    const deviation = ((Math.random() + Math.random() + Math.random()) / 3 - 0.5) * 2 * BAND_HALF_WIDTH;
                    dir.copy(bandU).multiplyScalar(Math.cos(phi))
                        .addScaledVector(bandV, Math.sin(phi))
                        .multiplyScalar(Math.cos(deviation))
                        .addScaledVector(galacticNormal, Math.sin(deviation));
                } else {
                    // General background stars: uniform over the whole sky
                    const z = Math.random() * 2 - 1;
                    const theta = Math.random() * Math.PI * 2;
                    const r = Math.sqrt(1 - z * z);
                    dir.set(r * Math.cos(theta), z, r * Math.sin(theta));
                }

                const radius = 800 + Math.random() * 3200;
                vertices.push(dir.x * radius, dir.y * radius, dir.z * radius);
            }

            geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
            const material = new THREE.PointsMaterial({ color: 0xffffff, size: 0.7, sizeAttenuation: true });
            const stars = new THREE.Points(geometry, material);
            scene.add(stars);
        }
        createStarfield();

        // Sun with texture
        const sunTexture = createSunTexture();
        const sunGeometry = new THREE.SphereGeometry(8, 64, 64);
        const sunMaterial = new THREE.MeshBasicMaterial({ map: sunTexture });
        const sun = new THREE.Mesh(sunGeometry, sunMaterial);
        scene.add(sun);

        // Sun glow
        const glowGeometry = new THREE.SphereGeometry(9, 64, 64);
        const glowMaterial = new THREE.MeshBasicMaterial({ color: 0xffaa00, transparent: true, opacity: 0.3 });
        const sunGlow = new THREE.Mesh(glowGeometry, glowMaterial);
        scene.add(sunGlow);

        // Planet data: name, radius, distance, speed (orbit, real-period-proportional),
        // spin (rotations per orbit, negative = retrograde), tilt (real axial
        // tilt in degrees — the planet spins around this tilted axis, not the
        // plain vertical), inclination (real tilt in degrees of the planet's
        // *orbital* plane relative to the ecliptic — Earth defines the
        // ecliptic, so its inclination is 0 by definition), textureFn,
        // moons (real-ratio-derived; each orbits in its planet's equatorial
        // plane by default — planeRef: 'ecliptic' and/or extraTilt override
        // that for the few real moons whose orbital plane notably differs)
        const planetsData = [
            { name: 'Mercury', radius: 1.2, distance: 15, speed: 0.083, spin: 1.5, tilt: 0.03, inclination: 7.00, textureFn: createMercuryTexture },
            { name: 'Venus', radius: 2.0, distance: 22, speed: 0.0325, spin: -0.9247, tilt: 2.64, inclination: 3.39, textureFn: createVenusTexture },
            { name: 'Earth', radius: 2.2, distance: 30, speed: 0.02, spin: 365.25, tilt: 23.44, inclination: 0, textureFn: createEarthTexture,
                moons: [
                    // The Moon orbits close to the ecliptic (not Earth's equator) —
                    // a relic of its giant-impact origin, unlike most regular moons.
                    { name: 'Moon', radius: 0.6, distance: 4, orbitSpeed: 0.268, planeRef: 'ecliptic', extraTilt: 5.14 }
                ] },
            { name: 'Mars', radius: 1.6, distance: 40, speed: 0.0106, spin: 669.6, tilt: 25.19, inclination: 1.85, textureFn: createMarsTexture,
                moons: [
                    { name: 'Phobos', radius: 0.15, distance: 2.2, orbitSpeed: 22.9 },
                    { name: 'Deimos', radius: 0.12, distance: 3.3, orbitSpeed: 5.78 }
                ] },
            { name: 'Jupiter', radius: 5.0, distance: 60, speed: 0.00169, spin: 10485, tilt: 3.13, inclination: 1.30, textureFn: createJupiterTexture,
                moons: [
                    { name: 'Io', radius: 0.32, distance: 7, orbitSpeed: 4.13 },
                    { name: 'Europa', radius: 0.28, distance: 9, orbitSpeed: 2.06 },
                    { name: 'Ganymede', radius: 0.47, distance: 11, orbitSpeed: 1.02 },
                    { name: 'Callisto', radius: 0.43, distance: 14, orbitSpeed: 0.44 }
                ] },
            { name: 'Saturn', radius: 4.2, distance: 80, speed: 0.000679, spin: 24232, tilt: 26.73, inclination: 2.49, textureFn: createSaturnTexture, hasRings: true,
                moons: [
                    { name: 'Rhea', radius: 0.14, distance: 9.0, orbitSpeed: 1.62 },
                    { name: 'Titan', radius: 0.47, distance: 11.9, orbitSpeed: 0.46 },
                    // Iapetus is a well-known outlier: notably inclined relative
                    // to Saturn's equatorial plane, unlike Saturn's other major moons.
                    { name: 'Iapetus', radius: 0.13, distance: 17.0, orbitSpeed: 0.09, extraTilt: 15.47 }
                ] },
            { name: 'Uranus', radius: 3.0, distance: 100, speed: 0.000238, spin: -42742, tilt: 97.77, inclination: 0.77, textureFn: createUranusTexture,
                // Uranus's major moons orbit prograde relative to Uranus's own
                // (retrograde) spin, so their orbitSpeed sign matches Uranus's
                // spin sign, not the usual solar-orbit-direction sign.
                moons: [
                    { name: 'Miranda', radius: 0.12, distance: 8.5, orbitSpeed: -5.17 },
                    { name: 'Ariel', radius: 0.17, distance: 9.6, orbitSpeed: -2.90 },
                    { name: 'Umbriel', radius: 0.17, distance: 10.8, orbitSpeed: -1.76 },
                    { name: 'Titania', radius: 0.23, distance: 12.7, orbitSpeed: -0.84 },
                    { name: 'Oberon', radius: 0.22, distance: 14.0, orbitSpeed: -0.54 }
                ] },
            { name: 'Neptune', radius: 2.8, distance: 120, speed: 0.000121, spin: 89690, tilt: 28.32, inclination: 1.77, textureFn: createNeptuneTexture,
                moons: [
                    { name: 'Triton', radius: 0.38, distance: 6.5, orbitSpeed: -1.24 }
                ] }
        ];

        const planets = [];

        planetsData.forEach(data => {
            // Planet mesh with texture
            const texture = data.textureFn();
            const geometry = new THREE.SphereGeometry(data.radius, 64, 64);
            const material = new THREE.MeshStandardMaterial({
                map: texture,
                roughness: 0.8,
                metalness: 0.05
            });
            const planet = new THREE.Mesh(geometry, material);
            planet.userData.name = data.name;

            // Rotation axis indicator, shown only while this planet is followed
            const axisLength = data.radius * 3;
            const axisGeometry = new THREE.BufferGeometry().setFromPoints([
                new THREE.Vector3(0, -axisLength / 2, 0),
                new THREE.Vector3(0, axisLength / 2, 0)
            ]);
            const axisLine = new THREE.Line(axisGeometry, new THREE.LineBasicMaterial({ color: 0x00ffff }));
            axisLine.visible = false;
            planet.add(axisLine);

            // Axial tilt lives on its own group with a fixed rotation, one
            // level above the planet mesh whose rotation.y is the continuous
            // spin. Combining tilt and spin as two rotations on the SAME
            // object would depend on THREE.Euler's axis-composition order —
            // easy to get backwards, and if reversed, spin would rotate the
            // tilt itself each frame instead of rotating around it, which is
            // exactly the wobble this is meant to avoid. Nesting them in
            // separate objects (parent tilt, child spin) makes the intended
            // "spin happens around the tilted axis" composition unambiguous:
            // the planet's local Y axis (pole, rings, axis line) is left
            // untouched by its own rotation.y, then carried to a fixed
            // tilted orientation by the unchanging parent transform.
            const tiltGroup = new THREE.Group();
            tiltGroup.rotation.z = (data.tilt || 0) * Math.PI / 180;
            tiltGroup.add(planet);

            // Orbit group: rotation.y here is the changing orbital angle.
            const orbitGroup = new THREE.Group();
            orbitGroup.add(tiltGroup);
            tiltGroup.position.x = data.distance;

            // Orbital-plane inclination: a fixed tilt one level ABOVE
            // orbitGroup, same reasoning as the axial tilt/spin split above —
            // orbitGroup's rotation.y changes every frame (orbital motion),
            // so the inclination has to be the unchanging parent, or the
            // orbital plane itself would wobble instead of just being tilted.
            const inclinationGroup = new THREE.Group();
            inclinationGroup.rotation.z = (data.inclination || 0) * Math.PI / 180;
            inclinationGroup.add(orbitGroup);
            scene.add(inclinationGroup);

            // Orbit path — parented the same way as the planet so the drawn
            // ring actually matches the tilted plane the planet travels in.
            const orbitGeometry = new THREE.RingGeometry(data.distance - 0.1, data.distance + 0.1, 128);
            const orbitMaterial = new THREE.MeshBasicMaterial({ color: 0x444444, side: THREE.DoubleSide, transparent: true, opacity: 0.4 });
            const orbitRing = new THREE.Mesh(orbitGeometry, orbitMaterial);
            orbitRing.rotation.x = -Math.PI / 2;
            inclinationGroup.add(orbitRing);

            // Saturn's rings
            if (data.hasRings) {
                const ringGeometry = new THREE.RingGeometry(data.radius + 1, data.radius + 3.5, 64);
                const ringMaterial = new THREE.MeshStandardMaterial({
                    color: 0xc8b88a,
                    side: THREE.DoubleSide,
                    transparent: true,
                    opacity: 0.7,
                    roughness: 0.8
                });
                const ring = new THREE.Mesh(ringGeometry, ringMaterial);
                // Flat and perpendicular to the planet's local Y axis, same as
                // the equatorial plane the spin (rotation.y) happens around.
                // Parented to the planet so it inherits its axial tilt; since
                // the ring plane is perpendicular to the spin axis, spinning
                // doesn't move the plane at all, so this doesn't wobble.
                ring.rotation.x = -Math.PI / 2;
                planet.add(ring);
            }

            // Store planet info
            planets.push({
                mesh: planet,
                orbitGroup: orbitGroup,
                tiltGroup: tiltGroup,
                inclinationGroup: inclinationGroup,
                data: data,
                axisLine: axisLine,
                angle: Math.random() * Math.PI * 2
            });
        });

        // Moons, generalized across every planet with a `moons` entry. Each
        // moon is parented into the planet's tilt/orbit hierarchy — NOT the
        // spinning planet mesh itself, which would drag the moon's orbit
        // around each frame — so it automatically inherits the planet's true
        // position and orbital-plane orientation without any manual per-frame
        // position copying. By default a moon anchors to tiltGroup (orbits in
        // the planet's equatorial plane, real for almost all regular moons);
        // planeRef: 'ecliptic' anchors to orbitGroup instead (the plane the
        // planet itself orbits the Sun in, before axial tilt is applied) for
        // the rare moon — Earth's — whose orbit ignores its planet's tilt.
        // An extraTilt (degrees) adds a further fixed tilt on top of that
        // reference plane, for moons whose real orbit deviates from it.
        const moonTexture = createMoonTexture();
        const moons = [];

        planets.forEach(p => {
            (p.data.moons || []).forEach(moonData => {
                const geometry = new THREE.SphereGeometry(moonData.radius, 32, 32);
                const material = new THREE.MeshStandardMaterial({ map: moonTexture, roughness: 0.9 });
                const mesh = new THREE.Mesh(geometry, material);
                mesh.userData.name = moonData.name;

                // tiltGroup already sits at the planet's location (it carries
                // the sun-distance offset), so equatorial-referenced moons
                // need no extra positioning. orbitGroup's origin is the SUN's
                // point in the orbital plane, not the planet — so an
                // ecliptic-referenced moon (just Earth's) needs an explicit
                // offset to actually anchor on the planet instead of the Sun.
                const eclipticRef = moonData.planeRef === 'ecliptic';
                const basePlane = eclipticRef ? p.orbitGroup : p.tiltGroup;
                const anchor = new THREE.Group();
                if (eclipticRef) {
                    anchor.position.x = p.data.distance;
                }
                if (moonData.extraTilt) {
                    anchor.rotation.x = moonData.extraTilt * Math.PI / 180;
                }
                basePlane.add(anchor);
                anchor.add(mesh);

                moons.push({
                    mesh,
                    anchor,
                    planet: p,
                    distance: moonData.distance,
                    orbitSpeed: moonData.orbitSpeed,
                    angle: Math.random() * Math.PI * 2
                });
            });
        });

        const followableBodies = [...planets, ...moons];

        // Camera follow: while a body is followed, the camera's orbit target
        // is pinned to it every frame, and the camera's offset is rotated
        // around a pivot by the same angle the body advanced this frame — the
        // Sun for a planet, its host planet for a moon — so the camera keeps
        // a constant bearing relative to that pivot (instead of drifting as
        // the body sweeps around its orbit). Free drag/zoom still works since
        // it's layered on top by OrbitControls' own update() each frame.
        let followedBody = null;
        const SUN_POS = new THREE.Vector3(0, 0, 0);
        const followWorldPos = new THREE.Vector3();
        const followPivotPos = new THREE.Vector3();
        const followNormal = new THREE.Vector3();
        const followQuat = new THREE.Quaternion();
        const prevPivotWorldPos = new THREE.Vector3();
        const followStatus = document.getElementById('follow-status');

        function getFollowPivot(body) {
            if (moons.includes(body)) {
                body.planet.mesh.getWorldPosition(followPivotPos);
                return followPivotPos;
            }
            return SUN_POS;
        }

        // The orbital plane isn't always the flat world XZ plane anymore
        // (planets have real orbital inclinations, moons follow their
        // planet's equatorial tilt) — so the axis to rotate the camera's
        // offset around is whichever group's local Y axis the body actually
        // revolves around, mapped into world space, not a fixed world axis.
        function getOrbitNormal(body) {
            const anchor = moons.includes(body) ? body.anchor : body.inclinationGroup;
            anchor.getWorldQuaternion(followQuat);
            return followNormal.set(0, 1, 0).applyQuaternion(followQuat);
        }

        function followBody(body) {
            // Only show the rotation-axis indicator for planets (moons in
            // this sim don't animate a spin, so they have no axis line).
            if (followedBody && followedBody.axisLine) {
                followedBody.axisLine.visible = false;
            }

            followedBody = body;
            if (body) {
                body.mesh.getWorldPosition(followWorldPos);
                controls.target.copy(followWorldPos);
                prevPivotWorldPos.copy(getFollowPivot(body));
                followStatus.textContent = `Following ${body.mesh.userData.name}`;
                if (body.axisLine) {
                    body.axisLine.visible = true;
                }
            } else {
                followStatus.textContent = '';
            }
        }

        // Animation
        // Slider position (0-1) is squared so low speeds get much finer control
        // than a linear slider would give, while still reaching full speed at 1.
        function sliderToTimeScale(t) {
            return t * t;
        }
        let timeScale = sliderToTimeScale(0.316);

        function animate() {
            requestAnimationFrame(animate);

            // Rotate sun (real ~27-day rotation period)
            sun.rotation.y += 0.27 * timeScale;

            // Animate planets
            planets.forEach(p => {
                p.angle += p.data.speed * timeScale;
                p.orbitGroup.rotation.y = p.angle;
                p.mesh.rotation.y += p.data.speed * (p.data.spin || 1) * timeScale;
            });

            // Animate moons: each moon is a real child of its planet's tilt
            // (or orbit) group, so it automatically inherits the planet's
            // current position and orbital-plane orientation — only its own
            // position within that local plane needs updating here. Uses the
            // same (x = cos, z = -sin) handedness as planets' own
            // Object3D.rotation.y orbits, so a positive orbitSpeed means
            // "prograde in the same sense as the rest of the system."
            moons.forEach(m => {
                m.angle += m.orbitSpeed * timeScale;
                m.mesh.position.x = Math.cos(m.angle) * m.distance;
                m.mesh.position.z = -Math.sin(m.angle) * m.distance;
            });

            // Keep the camera locked onto the followed body's reference frame
            if (followedBody) {
                const isMoon = moons.includes(followedBody);
                const pivotPos = getFollowPivot(followedBody);

                // Carry the camera along with any movement of the pivot itself
                // (the Sun never moves, so this is a no-op for planets).
                camera.position.add(pivotPos.clone().sub(prevPivotWorldPos));

                // Rotate the camera's offset from the pivot by the angle the
                // body advanced this frame, around that body's actual orbital
                // axis (which may be tilted by inclination/axial tilt), so it
                // keeps a constant bearing relative to the tilted plane
                // instead of drifting off it.
                const dAngle = (isMoon ? followedBody.orbitSpeed : followedBody.data.speed) * timeScale;
                const axis = getOrbitNormal(followedBody);
                const offset = camera.position.clone().sub(pivotPos);
                offset.applyAxisAngle(axis, dAngle);
                camera.position.copy(pivotPos).add(offset);

                followedBody.mesh.getWorldPosition(followWorldPos);
                controls.target.copy(followWorldPos);
                prevPivotWorldPos.copy(pivotPos);
            }

            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        // Time scale slider
        const timeSlider = document.getElementById('time-scale');
        const timeValue = document.getElementById('time-value');
        timeSlider.addEventListener('input', (event) => {
            timeScale = sliderToTimeScale(parseFloat(event.target.value));
            const decimals = timeScale < 0.01 ? 4 : 2;
            timeValue.textContent = timeScale.toFixed(decimals) + 'x';
        });

        // Resize handler
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Raycaster for planet hover
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        const label = document.getElementById('planet-label');

        window.addEventListener('mousemove', (event) => {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const planetMeshes = planets.map(p => p.mesh);
            const moonMeshes = moons.map(m => m.mesh);
            const intersects = raycaster.intersectObjects([...planetMeshes, ...moonMeshes]);

            if (intersects.length > 0) {
                const hit = intersects[0].object;
                const icon = moonMeshes.includes(hit) ? '🌙' : '🪐';
                label.textContent = `${icon} ${hit.userData.name}`;
                label.style.display = 'block';
            } else {
                label.style.display = 'none';
            }
        });

        // Click a planet/moon to follow it; click empty space to release.
        // Ignores clicks that end a drag (OrbitControls rotate), and only
        // reacts to clicks on the canvas itself, not the UI overlays.
        let mouseDownPos = null;
        renderer.domElement.addEventListener('mousedown', (event) => {
            mouseDownPos = { x: event.clientX, y: event.clientY };
        });

        renderer.domElement.addEventListener('click', (event) => {
            if (mouseDownPos && Math.hypot(event.clientX - mouseDownPos.x, event.clientY - mouseDownPos.y) > 5) {
                return;
            }

            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(followableBodies.map(b => b.mesh));

            if (intersects.length > 0) {
                const hit = intersects[0].object;
                followBody(followableBodies.find(b => b.mesh === hit));
            } else {
                followBody(null);
            }
        });
    </script>
</body>
</html>
