<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Solar System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            overflow: hidden;
            background: #000;
            font-family: 'Segoe UI', sans-serif;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px 20px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        #info h1 {
            font-size: 1.2rem;
            margin-bottom: 8px;
            color: #ffd700;
        }
        #info p {
            font-size: 0.8rem;
            color: #aaa;
            line-height: 1.5;
        }
        #planet-label {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #fff;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 0.9rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: none;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="info">
        <h1>☀️ Solar System</h1>
        <p>Drag to rotate | Scroll to zoom | Right-click to pan</p>
    </div>
    <div id="planet-label"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script>
        // Scene setup
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 10000);
        camera.position.set(0, 80, 150);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // Controls
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 20;
        controls.maxDistance = 500;

        // Lighting
        const ambientLight = new THREE.AmbientLight(0x333333);
        scene.add(ambientLight);

        const sunLight = new THREE.PointLight(0xffffff, 2, 1000);
        sunLight.position.set(0, 0, 0);
        scene.add(sunLight);

        // Starfield
        function createStarfield() {
            const geometry = new THREE.BufferGeometry();
            const vertices = [];
            for (let i = 0; i < 10000; i++) {
                const x = (Math.random() - 0.5) * 4000;
                const y = (Math.random() - 0.5) * 4000;
                const z = (Math.random() - 0.5) * 4000;
                vertices.push(x, y, z);
            }
            geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
            const material = new THREE.PointsMaterial({ color: 0xffffff, size: 0.7, sizeAttenuation: true });
            const stars = new THREE.Points(geometry, material);
            scene.add(stars);
        }
        createStarfield();

        // Sun
        const sunGeometry = new THREE.SphereGeometry(8, 64, 64);
        const sunMaterial = new THREE.MeshBasicMaterial({ color: 0xffdd33 });
        const sun = new THREE.Mesh(sunGeometry, sunMaterial);
        scene.add(sun);

        // Sun glow
        const glowGeometry = new THREE.SphereGeometry(9, 64, 64);
        const glowMaterial = new THREE.MeshBasicMaterial({ color: 0xffaa00, transparent: true, opacity: 0.3 });
        const sunGlow = new THREE.Mesh(glowGeometry, glowMaterial);
        scene.add(sunGlow);

        // Planet data: name, radius, distance, speed, color, hasRings
        const planetsData = [
            { name: 'Mercury', radius: 1.2, distance: 15, speed: 0.04, color: 0xb5a7a7 },
            { name: 'Venus', radius: 2.0, distance: 22, speed: 0.028, color: 0xe8cda0 },
            { name: 'Earth', radius: 2.2, distance: 30, speed: 0.02, color: 0x4488cc },
            { name: 'Mars', radius: 1.6, distance: 40, speed: 0.015, color: 0xcc5533 },
            { name: 'Jupiter', radius: 5.0, distance: 60, speed: 0.008, color: 0xd4a56a },
            { name: 'Saturn', radius: 4.2, distance: 80, speed: 0.006, color: 0xe8d5a3, hasRings: true },
            { name: 'Uranus', radius: 3.0, distance: 100, speed: 0.004, color: 0x88ccdd },
            { name: 'Neptune', radius: 2.8, distance: 120, speed: 0.003, color: 0x3355aa }
        ];

        const planets = [];

        planetsData.forEach(data => {
            // Planet mesh
            const geometry = new THREE.SphereGeometry(data.radius, 32, 32);
            const material = new THREE.MeshStandardMaterial({ color: data.color, roughness: 0.7, metalness: 0.1 });
            const planet = new THREE.Mesh(geometry, material);

            // Orbit group
            const orbitGroup = new THREE.Group();
            orbitGroup.add(planet);
            planet.position.x = data.distance;
            scene.add(orbitGroup);

            // Orbit path
            const orbitGeometry = new THREE.RingGeometry(data.distance - 0.1, data.distance + 0.1, 128);
            const orbitMaterial = new THREE.MeshBasicMaterial({ color: 0x444444, side: THREE.DoubleSide, transparent: true, opacity: 0.4 });
            const orbitRing = new THREE.Mesh(orbitGeometry, orbitMaterial);
            orbitRing.rotation.x = -Math.PI / 2;
            scene.add(orbitRing);

            // Saturn's rings
            if (data.hasRings) {
                const ringGeometry = new THREE.RingGeometry(data.radius + 1, data.radius + 3.5, 64);
                const ringMaterial = new THREE.MeshStandardMaterial({
                    color: 0xc8b88a,
                    side: THREE.DoubleSide,
                    transparent: true,
                    opacity: 0.7,
                    roughness: 0.8
                });
                const ring = new THREE.Mesh(ringGeometry, ringMaterial);
                ring.rotation.x = -Math.PI / 2.5;
                planet.add(ring);
            }

            // Store planet info
            planets.push({
                mesh: planet,
                orbitGroup: orbitGroup,
                data: data,
                angle: Math.random() * Math.PI * 2
            });
        });

        // Earth's moon
        const moonGeometry = new THREE.SphereGeometry(0.6, 16, 16);
        const moonMaterial = new THREE.MeshStandardMaterial({ color: 0xaaaaaa, roughness: 0.9 });
        const moon = new THREE.Mesh(moonGeometry, moonMaterial);
        const earthPlanet = planets[2];
        earthPlanet.mesh.add(moon);
        moon.position.set(4, 0, 0);

        // Animation
        let moonAngle = 0;

        function animate() {
            requestAnimationFrame(animate);

            // Rotate sun
            sun.rotation.y += 0.002;

            // Animate planets
            planets.forEach(p => {
                p.angle += p.data.speed;
                p.orbitGroup.rotation.y = p.angle;
                p.mesh.rotation.y += 0.01;
            });

            // Animate moon around Earth
            moonAngle += 0.03;
            moon.position.x = Math.cos(moonAngle) * 4;
            moon.position.z = Math.sin(moonAngle) * 4;

            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        // Resize handler
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Raycaster for planet hover
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        const label = document.getElementById('planet-label');

        window.addEventListener('mousemove', (event) => {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const meshes = planets.map(p => p.mesh);
            const intersects = raycaster.intersectObjects(meshes);

            if (intersects.length > 0) {
                const planetName = intersects[0].object.userData.name ||
                    planets.find(p => p.mesh === intersects[0].object)?.data.name;
                if (planetName) {
                    label.textContent = `🪐 ${planetName}`;
                    label.style.display = 'block';
                }
            } else {
                label.style.display = 'none';
            }
        });

        // Assign names to planet meshes for raycasting
        planets.forEach(p => {
            p.mesh.userData.name = p.data.name;
        });
    </script>
</body>
</html>
